title: "Food Bank Services"
description: "Providing essential food supplies to those experiencing food insecurity in our community."
image: "../../assets/programs/food-bank.webp"
imageAlt: "Food bank volunteers helping sort food."
featured: true
order: 1
sections:
  - type: full
    body: |
      Our Food Bank Services program has been a cornerstone of our mission to support those in need since 1984. We provide nutritious food supplies to individuals and families experiencing food insecurity in our community.

      ### How We Can Help

      - Provide emergency food assistance to those in need
      - Ensure access to nutritious and balanced food options
      - Support our community members with dignity and respect
      - Collaborate with local partners to maximize our impact
  - type: services
    heading: "Available Services"
    cards:
      - title: "Food Hamper"
        body: |
          - Comprehensive food hampers tailored to household size
          - Non-perishable staples (rice, pasta, canned goods)
          - Fresh produce when available
          - Dairy products and protein options
          - Personal care items
      - title: "In Between Hamper Program"
        body: |
          - Fresh bread and pastries from local bakeries
          - Seasonal produce from community gardens
          - Soups and beans for quick meals
          - Emergency supplies for urgent needs
  - type: schedule
    heading: "When to Visit"
    sections:
      - title: "Food Hamper"
        items:
          - days: "Tuesday to Thursday"
            hours: "10:00 AM - 3:00 PM"
      - title: "In Between Hamper Program"
        items:
          - days: "Monday & Friday"
            hours: "9:00 AM - 12:00 PM"
          - days: "Tuesday to Thursday"
            hours: "10:00 AM - 3:00 PM"
      - title: "Bread Pickup Locations"
        items:
          - days: "Monday"
            hours: "9:00 AM - 12:00 PM"
            location: "Camrose Community Church"
          - days: "Wednesday"
            hours: "1:00 PM - 3:00 PM"
            location: "Center Point Church"
  - type: full
    heading: "Eligibility & Registration"
    body: |
      - Open to all residents of Camrose and surrounding areas
      - Valid ID and proof of address required
      - No appointment needed for In Between Hamper Program services
      - Registration required for hamper services
      - Income assessment for ongoing support
      - Accommodation available for mobility needs
  - type: grid
    heading: "How It Works"
    body: |
      1. First Visit
         - Bring ID and proof of address
         - Complete registration (for hampers)
         - Discuss any dietary needs

      2. Ongoing Support
         - See our regular Food Hamper and In Between schedule
         - Access to all services
         - Connection to other programs
  - type: bordered
    heading: "Program Impact"
    body: |
      - Thousands of individuals served annually
      - Regular access to nutritious food
      - Emergency food security support
      - Community partnership network
      - Volunteer engagement opportunities
  - type: full
    heading: "Contact Us"
    body: |
      - For additional information please get in touch.
      - For dietary restrictions: Inform staff
      - For emergency assistance: Contact office
