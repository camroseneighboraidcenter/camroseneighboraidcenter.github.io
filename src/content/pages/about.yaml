# About page — hero, intro lead text, vision, values, beliefs,
# team section headings, and the bottom call-to-action.
# Team members themselves live in src/content/team/.
page: about

hero:
  title: "About Us"
  image: "../../assets/hero/hero-helping-hands.webp"
  ctaText: "Get Involved"
  ctaLink: "/contact#contact-form?subject=volunteer"

# Introductory lead paragraph shown below the hero
intro: "Camrose Neighbor Aid Center began as a collaboration between six evangelical churches and has grown into a network supported by 20 local churches. Our mission is rooted in faith and service, ensuring that no one in our community goes without basic needs."

vision:
  title: "Our Vision"
  content: "A community where everyone's basic needs are met through Christ-centered service and support."

values:
  title: "Our Values"
  items:
    - title: "Faith"
      description: "Rooted in Christian principles, serving all with compassion and grace."
    - title: "Community"
      description: "Building strong relationships and fostering a sense of belonging."
    - title: "Service"
      description: "Dedicated to meeting needs with care and dignity."
    - title: "Collaboration"
      description: "Working together with churches and organizations for greater impact."
    - title: "Responsiveness"
      description: "Acting swiftly in times of crisis and need."

beliefs:
  title: "Our Beliefs"
  items:
    - text: "We believe all things are possible through Christ."
      citation: "Matthew 19:26"
    - text: "We believe that Christians working together glorify God and make a difference."
      citation: "John 17:21-22"

# Section headings for the two team grids (members: src/content/team/)
teamHeadings:
  directors: "Board of Directors"
  staff: "Staff"

cta:
  title: "Join Our Mission"
  description: "Together, we can make a difference in our community. Join us as a volunteer or support our mission through donations."
  primaryCta:
    text: "Volunteer With Us"
    href: "/contact#contact-form?subject=volunteer"
    srText: "Join our team as a volunteer at Camrose Neighbor Aid Center"
  secondaryCta:
    text: "Support Our Mission"
    href: "/donate"
    srText: "Make a donation to support our community programs"
